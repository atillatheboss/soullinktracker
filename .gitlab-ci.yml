stages:
  - check
  - test

image: mcr.microsoft.com/playwright:v1.54.0-jammy

cache:
  paths:
    - node_modules/

before_script:
  - npm install

syntax-check:
  stage: check
  script:
    - node --check server.js

playwright-tests:
  stage: test
  script:
    - npx playwright install --with-deps
    - npm run dev &
    - npx wait-on http://localhost:3000
    - npx playwright test
