stages:
  - check
  - test

image: mcr.microsoft.com/playwright:v1.60.0-jammy

cache:
  paths:
    - node_modules/

before_script:
  - npm install
  - node server.js

syntax-check:
  stage: check
  script:
    - node --check server.js

playwright-tests:
  stage: test
  script:
    - npx playwright test
