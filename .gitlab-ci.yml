stages:
  - check
  - test

image: node:24.22.1-bookworm

cache:
  paths:
    - node_modules/

before_script:
  - npm install

syntax-check:
  stage: check
  script:
    - node --check server.js
    - node --test node-version.test.js

playwright-tests:
  stage: test
  script:
    - npx playwright install --with-deps
    - npx playwright test
